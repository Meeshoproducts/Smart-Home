<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f9;
  color:#222;
}
.header{
  background:#111827;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h2{margin:0}
.logout{
  background:#ef4444;
  border:0;
  color:white;
  padding:9px 14px;
  border-radius:7px;
}
.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
}
.login-box{
  max-width:400px;
  margin:70px auto;
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 5px 25px #0001;
}
input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:7px;
  border:1px solid #ddd;
}
.login-btn{
  background:#111827;
  color:white;
  border:0;
}
#error{
  color:#dc2626;
  margin-top:12px;
}
.order{
  background:white;
  margin-bottom:15px;
  padding:18px;
  border-radius:12px;
  box-shadow:0 3px 12px #0001;
}
.order h3{margin-top:0}
.detail{
  line-height:1.7;
}
.status{
  background:#f8fafc;
  border:1px solid #ddd;
  margin-top:12px;
}
#adminPanel{display:none}
.loading{text-align:center;padding:30px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">
  <h2>🔐 Smart Home Admin</h2>
  <p>Admin Login</p>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button class="login-btn" onclick="adminLogin()">Login</button>

  <div id="error"></div>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel">

  <div class="header">
    <h2>Smart Home Admin</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h2>📦 All Orders</h2>

    <div id="orders">
      <div class="loading">Loading orders...</div>
    </div>
  </div>

</div>


<script>

const SUPABASE_URL = "https://uqlyjoxfisbxqfbaootw.supabase.co";

/*
  IMPORTANT:
  Yahan apna existing Supabase PUBLISHABLE KEY
  paste karo. Service-role/secret key mat lagana.
*/
const SUPABASE_KEY = "sb_publishable_99aV2L6PAD5cQob66zMvhg_v_glCSU9";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// ===============================
// ADMIN LOGIN
// ===============================

async function adminLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("error");

  errorBox.textContent = "";

  if(!email || !password){
    errorBox.textContent = "Email aur password bharo.";
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    errorBox.textContent =
      "Login failed: " + error.message;
    return;
  }

  const user = data.user;

  // Check admin_users
  const {data:admin,error:adminError} =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();

  if(adminError || !admin){

    await supabaseClient.auth.signOut();

    errorBox.textContent =
      "Access denied. Ye account admin nahi hai.";

    return;
  }

  document.getElementById("loginPage").style.display="none";
  document.getElementById("adminPanel").style.display="block";

  loadOrders();
}


// ===============================
// LOAD ALL ORDERS
// ===============================

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML =
    '<div class="loading">Loading orders...</div>';

  const {data,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    box.innerHTML =
      "<p>Orders load nahi hue: " +
      error.message +
      "</p>";

    return;
  }

  if(!data || data.length===0){

    box.innerHTML =
      "<div class='loading'>📦 No orders found.</div>";

    return;
  }

  box.innerHTML = "";

  data.forEach(order => {

    const div =
      document.createElement("div");

    div.className="order";

    div.innerHTML = `

      <h3>📦 Order #${order.id}</h3>

      <div class="detail">

        <b>Product:</b>
        ${escapeHTML(order.product || "-")}<br>

        <b>Price:</b>
        ₹${escapeHTML(String(order.price || "-"))}<br>

        <b>Name:</b>
        ${escapeHTML(order.name || "-")}<br>

        <b>Mobile:</b>
        ${escapeHTML(order.phone || "-")}<br>

        <b>Address:</b>
        ${escapeHTML(order.address || "-")}<br>

        <b>Pincode:</b>
        ${escapeHTML(order.pincode || "-")}<br>

        <b>City:</b>
        ${escapeHTML(order.city || "-")}<br>

        <b>State:</b>
        ${escapeHTML(order.state || "-")}<br>

        <b>Order Date:</b>
        ${order.created_at
          ? new Date(order.created_at).toLocaleString("en-IN")
          : "-"}

      </div>

      <select class="status"
        data-id="${order.id}"
        onchange="updateStatus('${order.id}',this.value)">

        ${statusOption("Order Placed",order.status)}
        ${statusOption("Confirmed",order.status)}
        ${statusOption("Packed",order.status)}
        ${statusOption("Shipped",order.status)}
        ${statusOption("Out for Delivery",order.status)}
        ${statusOption("Delivered",order.status)}
        ${statusOption("Cancelled",order.status)}

      </select>

    `;

    box.appendChild(div);

  });

}


// ===============================
// STATUS OPTIONS
// ===============================

function statusOption(value,current){

  return `
    <option value="${value}"
      ${current===value ? "selected":""}>
      ${value}
    </option>
  `;

}


// ===============================
// UPDATE STATUS
// ===============================

async function updateStatus(id,newStatus){

  const {error} =
    await supabaseClient
      .from("orders")
      .update({
        status:newStatus
      })
      .eq("id",id);

  if(error){

    alert(
      "Status update nahi hua:\n" +
      error.message
    );

    loadOrders();
    return;
  }

  alert("Order status updated ✅");

}


// ===============================
// LOGOUT
// ===============================

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").style.display="none";
  document.getElementById("loginPage").style.display="block";

}


// ===============================
// HTML SAFETY
// ===============================

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
